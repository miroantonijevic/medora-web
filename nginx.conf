# Rate limiting zones (defined in http block, but declared here for include compatibility)
limit_req_zone $binary_remote_addr zone=preview:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=revalidate:10m rate=30r/m;

# ============================================================
# HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS — main site
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- SSL ---
    # Replace with your actual certificate paths (e.g. from Certbot)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # --- Proxy settings ---
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # --- Immutable static assets (Next.js build hashes) ---
    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Uploaded media (long cache, public) ---
    location /media/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # --- Brand / public static assets ---
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Draft / live preview (rate-limited) ---
    location /next/preview {
        limit_req zone=preview burst=3 nodelay;
        proxy_pass http://web:3000;
    }

    location /next/exit-preview {
        proxy_pass http://web:3000;
    }

    # --- Revalidation webhook (rate-limited, internal use) ---
    location /next/revalidate {
        limit_req zone=revalidate burst=20 nodelay;
        # Optionally restrict to Payload container IP:
        # allow 172.0.0.0/8;
        # deny all;
        proxy_pass http://web:3000;
    }

    # --- Payload admin (no public caching) ---
    location /admin {
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Payload REST API (no caching) ---
    location /api/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Everything else ---
    location / {
        proxy_pass http://web:3000;
    }
}
