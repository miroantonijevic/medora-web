# Rate limiting zones (defined in http block, but declared here for include compatibility)
limit_req_zone $binary_remote_addr zone=preview:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=revalidate:10m rate=30r/m;

# Phobs availability/rates: every call reaches the Phobs API, so cap per client. Generous enough
# for a guest browsing months and changing guest counts (the UI debounces and refetches rarely).
limit_req_zone $binary_remote_addr zone=phobs_read:10m rate=60r/m;
# Booking creation: a real guest books once.
limit_req_zone $binary_remote_addr zone=phobs_book:10m rate=6r/m;
# Inquiry form: only POST (submissions) is limited. An empty key is not limited, so the admin
# panel's authenticated reads of /api/inquiries are unaffected.
map $request_method $inquiry_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $inquiry_limit_key zone=inquiry:10m rate=6r/m;

# Over-limit requests get 429 (Too Many Requests) instead of the default 503.
limit_req_status 429;

# Behind a CDN or load balancer, $binary_remote_addr is the proxy's address and every visitor
# would share one limit. Before putting one in front of this nginx, trust its header, e.g.:
#   set_real_ip_from <proxy ip or range>;
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;

# ============================================================
# HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS — main site
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- SSL ---
    # Replace with your actual certificate paths (e.g. from Certbot)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # --- Proxy settings ---
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # --- Immutable static assets (Next.js build hashes) ---
    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Uploaded media (long cache, public) ---
    location /media/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # --- Brand / public static assets ---
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Draft / live preview (rate-limited) ---
    location /next/preview {
        limit_req zone=preview burst=3 nodelay;
        proxy_pass http://web:3000;
    }

    location /next/exit-preview {
        proxy_pass http://web:3000;
    }

    # --- Revalidation webhook (rate-limited, internal use) ---
    location /next/revalidate {
        limit_req zone=revalidate burst=20 nodelay;
        # Optionally restrict to Payload container IP:
        # allow 172.0.0.0/8;
        # deny all;
        proxy_pass http://web:3000;
    }

    # --- Phobs availability / rates (rate-limited: each call reaches the Phobs API) ---
    location ~ ^/api/phobs/(availability|rates)$ {
        limit_req zone=phobs_read burst=30 nodelay;
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Phobs booking creation (strictly rate-limited) ---
    location = /api/phobs/book {
        limit_req zone=phobs_book burst=3 nodelay;
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Inquiry form submissions (rate-limited, POST only, see the map above) ---
    location = /api/inquiries {
        limit_req zone=inquiry burst=5 nodelay;
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Payload admin (no public caching) ---
    location /admin {
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Payload REST API (no caching) ---
    location /api/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "no-store";
    }

    # --- Everything else ---
    location / {
        proxy_pass http://web:3000;
    }
}
